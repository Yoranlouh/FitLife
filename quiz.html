  if (el) el.textContent = Q.length;
}

function getVisible() {
  let qs = Q;
  if (state.retryMode && state.retryIds.length) {
    qs = qs.filter(q => state.retryIds.includes(q.id));
  }
  if (state.showFavsOnly) {
    qs = qs.filter(q => state.favorites.has(q.id));
  }
  if (state.levelFilter !== 'all') qs = qs.filter(q => q.level === state.levelFilter);
  if (state.topicFilter !== 'all') qs = qs.filter(q => q.topic === state.topicFilter);
  if (state.search) {
    const s = state.search.toLowerCase();
    qs = qs.filter(q => q.q.toLowerCase().includes(s) || q.a.toLowerCase().includes(s));
  }
  return qs;
}

function applyFilters() {
  const visible = getVisible();
  renderCards(visible);
  document.getElementById('question-count').textContent = `${visible.length} van ${Q.length} vragen`;
}

function getShuffleOrder(q) {
  if (!state.shuffleOrder[q.id]) {
    const idxs = [0,1,2];
    for (let i = idxs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
    }
    state.shuffleOrder[q.id] = idxs;
  }
  return state.shuffleOrder[q.id];
}

function buildAnswerHtml(q) {
  return `<div class="answer-box">${q.a}</div>${q.explain ? `<div class="explain">ℹ️ ${q.explain}</div>` : ''}`;
}

function buildChoicesHtml(q) {
  const order = getShuffleOrder(q);
  const answered = state.selected[q.id] !== undefined;
  const chosenIdx = state.selected[q.id];
  const letters = ['a','b','c'];
  return order.map((origIdx, pos) => {
    let cls = 'choice-btn';
    if (answered) {
      cls += ' disabled';
      if (origIdx === q.correct) cls += ' correct';
      else if (origIdx === chosenIdx) cls += ' incorrect';
    }
    return `<button class="${cls}" data-idx="${origIdx}" ${answered?'disabled':''} onclick="selectChoice(${q.id},${origIdx})"><span class="opt-letter">${letters[pos]})</span><span>${q.choices[origIdx]}</span></button>`;
  }).join('');
}

function renderCards(qs) {
  const c = document.getElementById('cards-container');
  c.innerHTML = '';
  qs.forEach((q, idx) => {
    const isFav = state.favorites.has(q.id);
    const result = state.results[q.id];
    const cardClass = ['card', result||'', isFav?'favorited':''].filter(Boolean).join(' ');
    const div = document.createElement('div');
    div.className = cardClass;
    div.id = 'card-' + q.id;
    const isMc = !!q.choices;
    const answered = isMc && state.selected[q.id] !== undefined;
    const bodyHtml = isMc ? `
        <div class="choices" id="choices-${q.id}">${buildChoicesHtml(q)}</div>
        <div class="mc-result" id="mcresult-${q.id}">${answered ? buildAnswerHtml(q) : ''}</div>
        <div class="card-footer">
          <span class="spacer"></span>
          <button class="fav-btn" onclick="toggleFav(${q.id})" title="Favoriet">${isFav?'⭐':'☆'}</button>
        </div>` : `
        ${buildAnswerHtml(q)}
        <div class="card-footer">
          <button class="btn btn-success btn-sm" onclick="markResult(${q.id},'correct')">✓ Correct</button>
          <button class="btn btn-danger btn-sm" onclick="markResult(${q.id},'incorrect')">✗ Fout</button>
          <span class="spacer"></span>
          <button class="fav-btn" onclick="toggleFav(${q.id})" title="Favoriet">${isFav?'⭐':'☆'}</button>
        </div>`;
    div.innerHTML = `
      <div class="card-header" onclick="toggleCard(${q.id})">
        <span class="q-num">#${idx+1}</span>
        <div style="flex:1">
          <div class="badges">
            <span class="badge badge-${q.level}">${levelLabel(q.level)}</span>
            <span class="badge badge-topic">${q.topic}</span>
          </div>
          <div class="q-text">${q.q}</div>
        </div>
        <span style="font-size:.9rem;color:var(--sub);padding-left:8px">${result==='correct'?'✅':result==='incorrect'?'❌':'💡'}</span>
      </div>
      <div class="card-body">${bodyHtml}</div>`;
    c.appendChild(div);
  });
  updateProgress();
}

function selectChoice(id, idx) {
  if (state.selected[id] !== undefined) return;
  const q = Q.find(x => x.id === id);
  if (!q) return;
  state.selected[id] = idx;
  const correct = idx === q.correct;
  state.results[id] = correct ? 'correct' : 'incorrect';

  const choicesDiv = document.getElementById('choices-' + id);
  if (choicesDiv) {
    choicesDiv.querySelectorAll('.choice-btn').forEach(btn => {
      const bIdx = parseInt(btn.dataset.idx, 10);
      btn.classList.add('disabled');
      btn.disabled = true;
      btn.onclick = null;
      if (bIdx === q.correct) btn.classList.add('correct');
      else if (bIdx === idx) btn.classList.add('incorrect');
    });
  }
  const resultDiv = document.getElementById('mcresult-' + id);
  if (resultDiv) resultDiv.innerHTML = buildAnswerHtml(q);

  const card = document.getElementById('card-' + id);
  if (card) {
    card.classList.remove('correct','incorrect');
    card.classList.add(state.results[id]);
    const icon = card.querySelector('.card-header > span:last-child');
    if (icon) icon.textContent = correct ? '✅' : '❌';
  }
  updateProgress();
  updateScore();
}

function levelLabel(l) {
  return {basic:'Basis',func:'Functioneel',tech:'Technisch',arch:'Architectuur',prak:'Praktijk',oral:'Mondeling'}[l]||l;
}

function toggleCard(id) {
  const c = document.getElementById('card-' + id);
  c.classList.toggle('open');
}

function expandAll() { document.querySelectorAll('.card').forEach(c=>c.classList.add('open')); }
function collapseAll() { document.querySelectorAll('.card').forEach(c=>c.classList.remove('open')); }

function setFilter(type, value, btn) {
  if (type === 'level') state.levelFilter = value;
  else state.topicFilter = value;
  state.showFavsOnly = false;
  state.retryMode = false;
  document.querySelectorAll(`[data-filter="${type}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function markResult(id, result) {
  state.results[id] = result;
  const c = document.getElementById('card-' + id);
  if (!c) return;
  c.classList.remove('correct','incorrect');
  c.classList.add(result);
  const icon = c.querySelector('.card-header > span:last-child');
  if (icon) icon.textContent = result==='correct'?'✅':'❌';
  updateProgress();
  updateScore();
}

function toggleFav(id) {
  if (state.favorites.has(id)) state.favorites.delete(id);
  else state.favorites.add(id);
  localStorage.setItem('fl-favs', JSON.stringify([...state.favorites]));
  const c = document.getElementById('card-' + id);
  if (c) {
    const btn = c.querySelector('.fav-btn');
    if (btn) btn.textContent = state.favorites.has(id) ? '⭐' : '☆';
    c.classList.toggle('favorited', state.favorites.has(id));
  }
  document.getElementById('fav-count').textContent = state.favorites.size;
}

function updateProgress() {
  const visible = getVisible();
  const answered = visible.filter(q => state.results[q.id]).length;
  const pct = visible.length ? Math.round(answered/visible.length*100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${answered} van ${visible.length} beantwoord`;
}

function updateScore() {
  const correct = Object.values(state.results).filter(v=>v==='correct').length;
  const total = Object.keys(state.results).length;
  document.getElementById('score-display').textContent = `${correct}/${total}`;
}

function showFavs() {
  state.showFavsOnly = !state.showFavsOnly;
  applyFilters();
  toast(state.showFavsOnly ? '⭐ Favorieten getoond' : 'Alle vragen getoond');
}

function showRetryMode() {
  const incorrect = Object.entries(state.results).filter(([,v])=>v==='incorrect').map(([k])=>parseInt(k));
  if (!incorrect.length) { toast('Geen foute vragen! 🎉'); return; }
  state.retryMode = true;
  state.retryIds = incorrect;
  state.showFavsOnly = false;
  applyFilters();
  toast(`🔄 Herhalingsmodus: ${incorrect.length} foute vragen`);
}

function shuffleVisible() {
  const visible = getVisible();
  const shuffled = [...visible].sort(()=>Math.random()-.5);
  renderCards(shuffled);
}

function resetAll() {
  if (!confirm('Score en resultaten resetten?')) return;
  state.results = {};
  state.selected = {};
  state.shuffleOrder = {};
  applyFilters();
  updateScore();
  toast('↺ Reset gedaan');
}

function toggleTheme() {
  state.darkMode = !state.darkMode;
  document.documentElement.classList.toggle('dark', state.darkMode);
  localStorage.setItem('fl-dark', state.darkMode ? '1' : '0');
  document.getElementById('theme-btn').textContent = state.darkMode ? '☀️ Light' : '🌙 Dark';
}

document.getElementById('search-input').addEventListener('input', e => {
  state.search = e.target.value;
  applyFilters();
});

// ── ORAL EXAM ────────────────────────────────────────────────────────────────
function startOralExam() {
  const oralQs = Q.filter(q => q.level === 'oral');
  oralQ = oralQs[Math.floor(Math.random()*oralQs.length)];
  document.getElementById('oral-q-text').textContent = oralQ.q;
  document.getElementById('oral-answer-section').style.display = 'none';
  document.getElementById('reveal-oral-btn').style.display = '';
  document.getElementById('oral-overlay').classList.add('show');
  startTimer(60);
}

function startTimer(secs) {
  clearInterval(oralTimer);
  oralSecs = secs;
  const fill = document.getElementById('timer-fill');
  const label = document.getElementById('timer-secs');
  fill.style.width = '100%';
  fill.style.background = 'var(--orange)';
  label.textContent = secs;
  oralTimer = setInterval(() => {
    oralSecs--;
    label.textContent = oralSecs;
    fill.style.width = (oralSecs/secs*100) + '%';
    if (oralSecs <= 10) fill.style.background = 'var(--red)';
    if (oralSecs <= 0) { clearInterval(oralTimer); revealOralAnswer(); }
  }, 1000);
}

function revealOralAnswer() {
  clearInterval(oralTimer);
  document.getElementById('oral-answer').innerHTML = oralQ.a;
  const followupEl = document.getElementById('oral-followups');
  followupEl.innerHTML = (oralQ.followups||[]).map(f=>`<li>${f}</li>`).join('');
  const tipsEl = document.getElementById('oral-tips');
  tipsEl.innerHTML = (oralQ.tips||[]).map(t=>`<li>${t}</li>`).join('');
  document.getElementById('oral-answer-section').style.display = 'block';
  document.getElementById('reveal-oral-btn').style.display = 'none';
}

function nextOralQuestion() {
  clearInterval(oralTimer);
  startOralExam();
}

function closeOral() {
  clearInterval(oralTimer);
  document.getElementById('oral-overlay').classList.remove('show');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── START ────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
